<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="form.css" />

<body>

    <form>
        <label for="name_input">Name</label><br />
        <input placeholder="Ching" id="name_input" name="name_input" type="text" /><br />

        <label for="email_input">Email</label><br />
        <input id="email_input" name="email" type="email" /><br />

        <label for="login_age">Age</label><br />
        <input type="number" id="login_age" name="age" /><br />

        <label>Phone number</label><br />
        <input type="tel" id="login_tel" name="login_phone" /><br />
        <label>Password</label><br />
        <input type="password" id="login_password" name="login_password" /><br />
        <label>Option Select</label><br />
        <select>
            <option>Option 1</option>
            <option>Option 2</option>
            <option>Option 3</option>
            <option>Option 4</option>
            <option>Option 5</option>
        </select><br />
        <label>Message</label><br />
        <textarea></textarea><br />
        <label>File</label><br />
        <input type="file" /><br />
        <label>Date of birth</label><br />
        <input type="date" /><br />
        <label>Checkbox</label><br />
        <input type="checkbox" /><br />
        <label>Color</label><br />
        <input type="color" /><br />
        <button>Submit</button>

        <h5>Already have an Account? Login</h5>

    </form>
</body>
